services:
  hindsight:
    # ghcr.io/vectorize-io/hindsight publishes multi-arch (amd64 + arm64) tags,
    # so this works on any Coolify host. `latest` is the "full" image (~3.7GB
    # arm64 / ~9GB amd64) — bundles local embedder + reranker, so OpenAI is only
    # used for fact extraction / reflection. To shrink to ~500MB use `:slim`
    # plus an external embedder (TEI / OpenAI / Cohere).
    image: ghcr.io/vectorize-io/hindsight:latest
    restart: unless-stopped
    environment:
      # --- LLM (used for retain extraction + reflect reasoning) ---
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_API_KEY: ${OPENAI_API_KEY}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-gpt-5-mini}

      # --- Embeddings: keep `local` (bundled BGE small) to avoid extra OpenAI cost.
      #     Override to `openai` if you'd rather pay for higher-quality embeddings.
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: ${HINDSIGHT_EMBEDDINGS_PROVIDER:-local}

      # --- Auth: require Bearer token on all API + MCP calls. ---
      # Clients send: `Authorization: Bearer ${HINDSIGHT_API_KEY}`
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_KEY}
      HINDSIGHT_API_MCP_AUTH_TOKEN: ${HINDSIGHT_API_KEY}

      # --- Control Plane (UI on port 9999) talks to API on the same container. ---
      HINDSIGHT_CP_DATAPLANE_API_URL: http://localhost:8888

      # --- Logging ---
      HINDSIGHT_API_LOG_LEVEL: ${HINDSIGHT_LOG_LEVEL:-info}
      HINDSIGHT_API_LOG_FORMAT: text
    volumes:
      # Embedded Postgres persistence. Wiping this volume wipes all memories.
      - hindsight_data:/home/hindsight/.pg0
    expose:
      - "8888"   # API + MCP — attach your Coolify domain to this
      - "9999"   # Control Plane UI — optionally attach a second domain
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  hindsight_data:
