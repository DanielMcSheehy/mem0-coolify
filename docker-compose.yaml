services:
  mem0:
    build: .
    image: mem0-coolify:latest
    restart: unless-stopped
    environment:
      # --- LLM / Embedder (OpenAI) ---
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # --- Postgres (pgvector — the only datastore Mem0's server actually uses) ---
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mem0}
      POSTGRES_USER: ${POSTGRES_USER:-mem0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_COLLECTION_NAME: ${POSTGRES_COLLECTION_NAME:-mem0_memories}

      # --- Models ---
      MEM0_DEFAULT_LLM_MODEL: ${MEM0_LLM_MODEL:-gpt-4.1-mini}
      MEM0_DEFAULT_EMBEDDER_MODEL: ${MEM0_EMBEDDER_MODEL:-text-embedding-3-small}

      # --- Auth (server requires ONE of these) ---
      # ADMIN_API_KEY: legacy single-key auth, sent as `Authorization: Bearer <key>`
      # JWT_SECRET:    required even when using ADMIN_API_KEY (used to sign tokens)
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./history:/app/history
    expose:
      - "8000"
    # Coolify maps a public domain to this container.
    # Coolify's Traefik handles ingress + TLS — no host port binding needed.
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  postgres:
    image: ankane/pgvector:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mem0}
      POSTGRES_USER: ${POSTGRES_USER:-mem0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mem0} -d ${POSTGRES_DB:-mem0}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
